<div class="auth-card">
  <div class="auth-header">
    <i class="fas fa-key auth-icon"></i>
    <h1 class="auth-title">Forgot Password?</h1>
    <p class="auth-subtitle">Enter your email or National ID to receive a reset link.</p>
  </div>

  <div class="role-toggles">
    <button type="button"
            [class.active]="resetMethod === 'email'"
            (click)="setResetMethod('email')">
      By Email
    </button>
    <button type="button"
            [class.active]="resetMethod === 'nationalId'"
            (click)="setResetMethod('nationalId')">
      By National ID
    </button>
  </div>

  <form #forgotPasswordForm="ngForm" (ngSubmit)="requestReset()" class="auth-form">
    <div *ngIf="resetMethod === 'email'" class="form-group">
      <label for="email" class="form-label">Email Address</label>
      <input type="email" id="email" name="identifier" [(ngModel)]="identifier" class="form-input" placeholder="e.g., user@example.com" required email #emailInput="ngModel">
      <div *ngIf="emailInput.invalid && (emailInput.dirty || emailInput.touched)" class="form-error">
        Please enter a valid email address.
      </div>
    </div>

    <div *ngIf="resetMethod === 'nationalId'" class="form-group">
      <label for="nationalId" class="form-label">National ID</label>
      <input type="text" id="nationalId" name="identifier" [(ngModel)]="identifier" class="form-input" placeholder="Enter your 14-digit National ID" required pattern="^[0-9]{14}$" maxlength="14" #nationalIdInput="ngModel">
      <div *ngIf="nationalIdInput.invalid && (nationalIdInput.dirty || nationalIdInput.touched)" class="form-error">
        Please enter a valid 14-digit National ID.
      </div>
    </div>

    <button type="submit" [disabled]="!forgotPasswordForm.form.valid || isLoading" class="auth-button">
      <i class="fas fa-paper-plane button-icon"></i>
      {{ isLoading ? 'Sending...' : 'Send Reset Link' }}
    </button>
  </form>
</div>

<div *ngIf="showPopup" class="popup-overlay" (click)="closePopup()">
  <div class="popup-card" (click)="$event.stopPropagation()">
    <div class="popup-header">
      <i [class]="popupIcon + ' popup-icon ' + popupType"></i>
      <h2 class="popup-title">{{ popupTitle }}</h2>
    </div>
    <p class="popup-message">{{ popupMessage }}</p>
    <button (click)="closePopup()" class="popup-close-btn">Close</button>
  </div>
</div>
