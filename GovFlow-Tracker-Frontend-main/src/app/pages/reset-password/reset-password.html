<div class="auth-card">
  <div class="auth-header">
    <i class="fas fa-lock auth-icon"></i>
    <h1 class="auth-title">Reset Your Password</h1>
    <p class="auth-subtitle">Choose a new, strong password.</p>
  </div>

  <form #resetPasswordForm="ngForm" (ngSubmit)="resetPassword()" class="auth-form" autocomplete="off">
    <div class="form-group">
      <label for="newPassword" class="form-label">New Password</label>
      <div class="password-wrapper">
        <input
          [type]="isNewPasswordVisible ? 'text' : 'password'"
          id="newPassword"
          name="newPassword"
          [(ngModel)]="newPassword"
          class="form-input"
          placeholder="Enter new password"
          required
          #newPasswordInput="ngModel"
          (input)="validatePassword()"
          (copy)="false"
          (paste)="false"
          autocomplete="new-password">
        <i class="password-toggle-icon fas"
           [class.fa-eye-slash]="isNewPasswordVisible"
           [class.fa-eye]="!isNewPasswordVisible"
           (click)="toggleNewPasswordVisibility()"></i>
      </div>
      <div *ngIf="newPasswordInput.dirty || newPasswordInput.touched" class="password-steps">
        <div *ngFor="let validation of passwordValidations | keyvalue" class="step">
          <i *ngIf="validation.value.valid" class="fas fa-check-circle valid-check-icon"></i>
          <i *ngIf="!validation.value.valid" class="fas fa-times-circle invalid-check-icon"></i>
          <span [ngClass]="{
            'valid-step': validation.value.valid,
            'invalid-step': !validation.value.valid
          }">
            {{ validation.value.text }}
          </span>
        </div>
      </div>
    </div>

    <div class="form-group">
      <label for="confirmPassword" class="form-label">Confirm New Password</label>
      <div class="password-wrapper">
        <input
          [type]="isConfirmPasswordVisible ? 'text' : 'password'"
          id="confirmPassword"
          name="confirmPassword"
          [(ngModel)]="confirmPassword"
          class="form-input"
          placeholder="Confirm new password"
          required
          #confirmPasswordInput="ngModel"
          (copy)="false"
          (paste)="false"
          autocomplete="new-password">
        <i class="password-toggle-icon fas"
           [class.fa-eye-slash]="isConfirmPasswordVisible"
           [class.fa-eye]="!isConfirmPasswordVisible"
           (click)="toggleConfirmPasswordVisibility()"></i>
      </div>
      <div *ngIf="confirmPasswordInput.touched && newPassword !== confirmPassword" class="form-error">
        Passwords do not match.
      </div>
    </div>
    <button type="submit" [disabled]="!resetPasswordForm.form.valid || !isPasswordStrong || newPassword !== confirmPassword || isLoading" class="auth-button">
      <i class="fas fa-save button-icon"></i>
      {{ isLoading ? 'Resetting...' : 'Reset Password' }}
    </button>
  </form>
</div>

<div *ngIf="showPopup" class="popup-overlay" (click)="closePopup()">
  <div class="popup-card" (click)="$event.stopPropagation()">
    <div class="popup-header">
      <i [class]="popupIcon + ' popup-icon ' + popupType"></i>
      <h2 class="popup-title">{{ popupTitle }}</h2>
    </div>
    <p class="popup-message">{{ popupMessage }}</p>
    <button (click)="closePopupAndRedirect()" class="popup-close-btn">Close</button>
  </div>
</div>
